<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كافتيريا حلم القهوة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f5f5f7; /* لون رمادي فاتح جداً مريح للعين */
            color: #1d1d1f;
            padding-bottom: 120px; /* مساحة للسلة العائمة */
            overflow-x: hidden;
        }

        header {
            text-align: center;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 800;
            background: rgba(245, 245, 247, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* شبكة المنتجات */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 منتجات بالصف لترتيب أجمل */
            gap: 12px;
            padding: 15px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            touch-action: none; /* مهم لمنع تعارض السحب مع النزول بالصفحة */
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.95);
            background: #fdfdfd;
        }

        .emoji {
            font-size: 2.5rem;
            margin-bottom: 8px;
            pointer-events: none;
        }

        .name {
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            color: #515154;
            pointer-events: none;
        }

        .price {
            font-size: 0.8rem;
            font-weight: 800;
            color: #0071e3; /* أزرق تفاعلي */
            margin-top: 5px;
            pointer-events: none;
        }

        /* العنصر الوهمي أثناء السحب (مخفي برمجياً لتسريع الأداء) */
        #drag-ghost {
            position: fixed;
            top: 0; left: 0;
            background: #ffffff;
            border-radius: 20px;
            padding: 15px 5px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            z-index: 1000;
            pointer-events: none;
            opacity: 0.95;
            transform-origin: center;
            will-change: transform; /* لضمان نعومة الحركة */
        }

        /* السلة العائمة (Floating Cart) */
        .cart-pill {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1d1d1f;
            color: #ffffff;
            padding: 15px 25px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 85%;
            box-shadow: 0 15px 30px rgba(29, 29, 31, 0.3);
            z-index: 50;
            transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .cart-pill.active {
            background: #0071e3;
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 113, 227, 0.4);
        }

        .cart-info {
            display: flex;
            flex-direction: column;
        }

        .cart-title {
            font-size: 0.8rem;
            color: #a1a1a6;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .cart-count {
            background: #ffffff;
            color: #1d1d1f;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
        }

        /* حركة النبض عند الإضافة */
        @keyframes pop {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.1); }
            100% { transform: translateX(-50%) scale(1); }
        }
        .animate-pop { animation: pop 0.3s ease; }
    </style>
</head>
<body>

    <header>حلم القهوة ☕</header>

    <div class="grid" id="grid">
        <!-- المنتجات ستظهر هنا -->
    </div>

    <!-- هذا العنصر هو سر السلاسة (لا نعيد إنشائه، فقط نحركه) -->
    <div id="drag-ghost"></div>

    <div class="cart-pill" id="cart">
        <div class="cart-info">
            <span class="cart-title">إجمالي الطلب</span>
            <span class="cart-total" id="total">0.00 د.أ</span>
        </div>
        <div class="cart-count" id="count">0</div>
    </div>

    <script>
        const products = [
            { id: 'ameed', name: 'قهوة عميد', price: 1.00, icon: '☕' },
            { id: 'nescafe', name: 'نسكافيه', price: 0.50, icon: '☕' },
            { id: 'tea', name: 'شاي', price: 0.30, icon: '🍵' },
            { id: 'zhoorat', name: 'زهورات', price: 0.50, icon: '🌿' },
            { id: 'pepsi', name: 'بيبسي', price: 0.35, icon: '🥤' },
            { id: 'water', name: 'ماء', price: 0.25, icon: '💧' },
            { id: 'shisha', name: 'أرجيلة', price: 3.00, icon: '💨' },
            { id: 'zoom', name: 'شبس زوم', price: 0.25, icon: '🥔' },
            { id: 'cheesy', name: 'شيزي', price: 0.25, icon: '🧀' },
            { id: 'seeds', name: 'بزر', price: 0.50, icon: '🌻' },
            { id: 'snickers', name: 'سنكرز', price: 0.50, icon: '🍫' },
            { id: 'magisto', name: 'ماجيستو', price: 0.35, icon: '🍪' }
        ];

        const grid = document.getElementById('grid');
        const ghost = document.getElementById('drag-ghost');
        const cart = document.getElementById('cart');
        
        let totalAmount = 0;
        let itemsCount = 0;
        
        // متغيرات تتبع الحركة
        let activeCard = null;
        let startX, startY;
        let cardRect;

        // طباعة المنتجات (مرتين لملء الشاشة وجعلها لا نهائية)
        const displayList = [...products, ...products, ...products];
        
        displayList.forEach(product => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.price = product.price;
            
            card.innerHTML = `
                <div class="emoji">${product.icon}</div>
                <div class="name">${product.name}</div>
                <div class="price">${product.price.toFixed(2)} د.أ</div>
            `;
            
            grid.appendChild(card);

            // إضافة مستمعات الحركة لكل بطاقة
            card.addEventListener('pointerdown', handleDragStart);
        });

        function handleDragStart(e) {
            activeCard = e.currentTarget;
            cardRect = activeCard.getBoundingClientRect();
            
            startX = e.clientX;
            startY = e.clientY;

            // تجهيز العنصر الشبح بنفس محتوى وحجم البطاقة الأصلية
            ghost.innerHTML = activeCard.innerHTML;
            ghost.style.width = `${cardRect.width}px`;
            ghost.style.height = `${cardRect.height}px`;
            
            // تحريك الشبح لمكان البطاقة وإظهاره
            ghost.style.transform = `translate3d(${cardRect.left}px, ${cardRect.top}px, 0) scale(1.05) rotate(3deg)`;
            ghost.style.display = 'flex';
            
            // تبهيت البطاقة الأصلية
            activeCard.style.opacity = '0.3';
        }

        document.addEventListener('pointermove', (e) => {
            if (!activeCard) return;

            // حساب المسافة المقطوعة وتحديث مكان الشبح باستخدام GPU
            const moveX = e.clientX - startX;
            const moveY = e.clientY - startY;
            
            ghost.style.transform = `translate3d(${cardRect.left + moveX}px, ${cardRect.top + moveY}px, 0) scale(1.05) rotate(3deg)`;

            // التفاعل مع السلة عند الاقتراب
            const cartRect = cart.getBoundingClientRect();
            if (e.clientY > cartRect.top - 30) {
                cart.classList.add('active');
            } else {
                cart.classList.remove('active');
            }
        });

        document.addEventListener('pointerup', (e) => {
            if (!activeCard) return;

            const cartRect = cart.getBoundingClientRect();
            
            // إذا تم الإفلات فوق السلة
            if (e.clientY > cartRect.top - 30) {
                const price = parseFloat(activeCard.dataset.price);
                totalAmount += price;
                itemsCount++;
                
                document.getElementById('total').textContent = `${totalAmount.toFixed(2)} د.أ`;
                document.getElementById('count').textContent = itemsCount;

                // أنيميشن الإضافة
                cart.classList.remove('animate-pop');
                void cart.offsetWidth; // إعادة ضبط الأنيميشن
                cart.classList.add('animate-pop');
                
                if (navigator.vibrate) navigator.vibrate(40);
            }

            // إعادة كل شيء لطبيعته
            ghost.style.display = 'none';
            activeCard.style.opacity = '1';
            cart.classList.remove('active');
            activeCard = null;
        });

        // تحسين تجربة التمرير (Scroll):
        // بما أن البطاقات لا تقبل السحب لتمرير الصفحة، يمكن للمستخدم التمرير عبر لمس المسافات البيضاء.
    </script>
</body>
</html>
